name: Test

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-26
          - name: Linux amd64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The Linux feature modules need Wayland, Vulkan, shaderc and OpenSSL
      # headers on top of readline/ffi/sqlite; `make deps` installs the set.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: make deps

      # test/ns_cook_test.py needs Python 3.11+ (tomllib) and Pillow; with
      # NS_REQUIRE_COOK_TESTS=1 a missing dependency fails instead of skipping.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python3 -m pip install Pillow

      # `make test` builds the interpreter, required native modules and C test
      # binaries, then runs the core suites. The compile/interpret parity suite
      # runs on both hosts: mach-o AArch64 there, ELF AMD64 here.
      - name: Test
        run: make test
        env:
          NS_REQUIRE_COOK_TESTS: '1'

      # The statically bound FFI table must match lib/*.ns and the native
      # sources it was generated from.
      - name: Check embedded FFI table
        if: runner.os == 'macOS'
        run: make check-embedded-ffi
