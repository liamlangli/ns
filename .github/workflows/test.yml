name: Test

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # `make test` builds the interpreter, required native modules and C test
      # binaries, then runs the core suites.
      - name: Test
        run: make test
